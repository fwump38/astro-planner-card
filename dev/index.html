<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Milky Way Planner — dev harness</title>
  <style>
    :root {
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --primary-color: #03a9f4;
      --divider-color: rgba(0, 0, 0, 0.12);
      --card-background-color: #fff;
    }
    body.dark {
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #9b9b9b;
      --divider-color: rgba(255, 255, 255, 0.12);
      --card-background-color: #1c1c1c;
      background: #111;
    }
    body { font-family: Roboto, system-ui, sans-serif; margin: 0; padding: 16px; color: var(--primary-text-color); }
    ha-card { display: block; background: var(--card-background-color); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.2); max-width: 760px; margin: 0 auto; }
    ha-icon { display: inline-block; width: 14px; height: 14px; }
    ha-icon::before { content: "•"; }
    .bar { max-width: 760px; margin: 0 auto 12px; display: flex; gap: 12px; align-items: center; font-size: 14px; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Dev harness</strong> (mocked <code>hass</code>; HA-only elements like ha-form aren't available here)
    <label><input type="checkbox" id="dark" /> dark</label>
  </div>
  <milky-way-planner-card id="card"></milky-way-planner-card>
  <script type="module">
    import "../dist/milky-way-planner-card.js";

    // Test data only. Coordinates are NM-area examples; the real card learns them from AstroWeather sensors.
    const SITES = {
      home: { name: "Home", lat: 35.687, lon: -105.938, clear: 0.55 },
      chaco: { name: "Chaco Canyon", lat: 36.06, lon: -107.96, clear: 0.9 },
      abiquiu: { name: "Abiquiu", lat: 36.33, lon: -106.47, clear: 0.85 },
      carrizozo: { name: "Valley of Fires", lat: 33.68, lon: -105.92, clear: 0.7 },
    };
    const DOMES = [
      { name: "Albuquerque", latitude: 35.084, longitude: -106.651, population: 560000 },
      { name: "Santa Fe", latitude: 35.687, longitude: -105.938, population: 89000 },
      { name: "Rio Rancho", latitude: 35.233, longitude: -106.664, population: 104000 },
      { name: "Farmington", latitude: 36.728, longitude: -108.219, population: 46000 },
    ];

    const hass = {
      states: {},
      entities: {},
      config: { latitude: 35.687, longitude: -105.938, elevation: 2100, time_zone: "America/Denver" },
      locale: { language: "en", time_format: "12" },
      connection: {
        subscribeMessage(cb, msg) {
          const site = SITES[msg.entity_id.replace("weather.astroweather_", "")];
          const start = Math.floor(Date.now() / 3600e3) * 3600e3;
          const forecast = Array.from({ length: 48 }, (_, i) => {
            const wave = 0.5 + 0.5 * Math.sin(i / 5 + site.lat);
            const clear = Math.min(1, Math.max(0, site.clear * 0.6 + wave * 0.45));
            return {
              datetime: new Date(start + i * 3600e3).toISOString(),
              cloudless_percentage: Math.round(clear * 100),
              cloudcover_percentage: Math.round((1 - clear) * 100),
              transparency_percentage: Math.round(55 + clear * 40),
              seeing_percentage: Math.round(40 + wave * 50),
              calm_percentage: Math.round(60 + (1 - wave) * 35),
              humidity: Math.round(30 + wave * 40),
              temperature: Math.round(18 - Math.abs(((i + 14) % 24) - 12) * 1.2),
              precipitation_amount: 0,
            };
          });
          setTimeout(() => cb({ type: "event", forecast }), 50);
          return Promise.resolve(() => {});
        },
      },
    };
    for (const [id, s] of Object.entries(SITES)) {
      const e = `weather.astroweather_${id}`;
      hass.states[e] = { entity_id: e, state: "sunny", attributes: { friendly_name: `AstroWeather ${s.name}` }, last_updated: new Date().toISOString() };
      hass.states[`sensor.astroweather_${id}_latitude`] = { entity_id: `sensor.astroweather_${id}_latitude`, state: String(s.lat), attributes: {} };
      hass.states[`sensor.astroweather_${id}_longitude`] = { entity_id: `sensor.astroweather_${id}_longitude`, state: String(s.lon), attributes: {} };
    }

    const card = document.getElementById("card");
    card.setConfig({
      type: "custom:milky-way-planner-card",
      title: "Milky Way planner",
      default_tab: new URLSearchParams(location.search).get("tab") ?? "ranking",
      nights: 3,
      sites: [
        { entity: "weather.astroweather_home", name: "Home (baseline)", bortle: 5 },
        { entity: "weather.astroweather_chaco", bortle: 1, drive_minutes: 180 },
        { entity: "weather.astroweather_abiquiu", bortle: 3, drive_minutes: 60 },
        { entity: "weather.astroweather_carrizozo", name: "Valley of Fires", bortle: 2, drive_minutes: 150 },
      ],
      light_domes: DOMES,
    });
    card.hass = hass;

    if (new URLSearchParams(location.search).has("bare")) document.querySelector(".bar").style.display = "none";
    document.getElementById("dark").addEventListener("change", (e) => document.body.classList.toggle("dark", e.target.checked));
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astro Planner — dev harness</title>
  <style>
    :root {
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --primary-color: #03a9f4;
      --divider-color: rgba(0, 0, 0, 0.12);
      --card-background-color: #fff;
    }
    body.dark {
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #9b9b9b;
      --divider-color: rgba(255, 255, 255, 0.12);
      --card-background-color: #1c1c1c;
      background: #111;
    }
    body { font-family: Roboto, system-ui, sans-serif; margin: 0; padding: 16px; color: var(--primary-text-color); }
    ha-card { display: block; background: var(--card-background-color); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.2); max-width: 760px; margin: 0 auto; }
    ha-icon { display: inline-block; width: 14px; height: 14px; }
    ha-icon::before { content: "•"; }
    .bar { max-width: 760px; margin: 0 auto 12px; display: flex; gap: 12px; align-items: center; font-size: 14px; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Dev harness</strong> (mocked <code>hass</code> and integration responses from <code>mock.json</code>; HA-only elements like ha-form aren't available here)
    <label><input type="checkbox" id="dark" /> dark</label>
  </div>
  <astro-planner-card id="card"></astro-planner-card>
  <script type="module">
    // Canned responses from the integration for a fixed "now", written by the integration repo's scripts/export_card_mock.py:
    //   PYTHONPATH=. .venv/bin/python scripts/export_card_mock.py ../astro-planner-card/dev/mock.json
    const mock = await (await fetch("./mock.json")).json();

    // Freeze the clock at the mock's "now" before the card loads.
    const RealDate = Date;
    const offset = new RealDate(mock.now).getTime() - RealDate.now();
    globalThis.Date = class extends RealDate {
      constructor(...args) {
        if (args.length === 0) super(RealDate.now() + offset);
        else super(...args);
      }
      static now() {
        return RealDate.now() + offset;
      }
    };
    await import("../dist/astro-planner-card.js");

    const sites = mock.overview.sites;
    const hass = {
      states: {},
      entities: {},
      config: { latitude: 35.687, longitude: -105.938, elevation: 2100, time_zone: "America/Denver", components: ["astro_planner"] },
      locale: { language: "en", time_format: "12" },
      callWS: async (msg) => {
        const type = msg.type.replace("astro_planner/", "");
        if (type === "overview") return mock.overview;
        if (type === "calendar") {
          const start = new RealDate(msg.start + "T00:00:00Z");
          const nights = [];
          for (let i = 0; i < msg.days; i++) {
            const key = new RealDate(start.getTime() + i * 86400e3).toISOString().slice(0, 10);
            if (mock.calendar[key]) nights.push(mock.calendar[key]);
          }
          return { api_version: 3, nights };
        }
        if (type === "sky_hours") {
          const sky = mock.sky[msg.entity];
          const from = new RealDate(msg.start).getTime();
          return { api_version: 3, hours: sky.hours.filter((h) => h.t >= from).slice(0, msg.hours) };
        }
        if (type === "targets") return { api_version: 3, ...mock.targets[msg.start] };
        if (type === "showers") return { api_version: 3, showers: mock.showers };
        throw new Error(`unmocked ${msg.type}`);
      },
      connection: {
        subscribeMessage(cb, msg) {
          const site = sites.find((s) => s.entity === msg.entity_id);
          const start = Math.floor(Date.now() / 3600e3) * 3600e3;
          const clearBase = { chaco: 0.9, abiquiu: 0.85, carrizozo: 0.7 }[msg.entity_id.replace("weather.astroweather_", "")] ?? 0.55;
          const forecast = Array.from({ length: 48 }, (_, i) => {
            const wave = 0.5 + 0.5 * Math.sin(i / 5 + site.latitude);
            const clear = Math.min(1, Math.max(0, clearBase * 0.6 + wave * 0.45));
            return {
              datetime: new RealDate(start + i * 3600e3).toISOString(),
              cloudless_percentage: Math.round(clear * 100),
              cloudcover_percentage: Math.round((1 - clear) * 100),
              transparency_percentage: Math.round(55 + clear * 40),
              seeing_percentage: Math.round(40 + wave * 50),
              calm_percentage: Math.round(60 + (1 - wave) * 35),
              humidity: Math.round(30 + wave * 40),
              temperature: Math.round(18 - Math.abs(((i + 14) % 24) - 12) * 1.2),
              precipitation_amount: 0,
            };
          });
          setTimeout(() => cb({ type: "event", forecast }), 50);
          return Promise.resolve(() => {});
        },
      },
    };
    for (const s of sites) {
      hass.states[s.entity] = { entity_id: s.entity, state: "sunny", attributes: {}, last_updated: new Date().toISOString() };
    }

    const card = document.getElementById("card");
    card.setConfig({ type: "custom:astro-planner-card", title: "Astro planner", default_tab: new URLSearchParams(location.search).get("tab") ?? "ranking" });
    card.hass = hass;
    const month = new URLSearchParams(location.search).get("month"); // e.g. 2027-05
    if (month) { const [y, m] = month.split("-").map(Number); card._calYear = y; card._calMonth = m; }

    const q = new URLSearchParams(location.search);
    if (q.get("group")) card._targetGroup = q.get("group"); // e.g. galaxy
    if (q.get("sort")) card._targetSort = q.get("sort"); // placement | brightness | altitude | name
    if (q.get("offset")) card._targetOffset = Number(q.get("offset")); // nights after tonight

    if (new URLSearchParams(location.search).has("bare")) document.querySelector(".bar").style.display = "none";
    document.getElementById("dark").addEventListener("change", (e) => document.body.classList.toggle("dark", e.target.checked));
  </script>
</body>
</html>
